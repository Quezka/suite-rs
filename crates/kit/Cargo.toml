[package]
name = "quezka-kit"
version = "0.1.0"
description = "The Quezka suite's shared look in Rust: theme, liquid glass with real backdrop blur, the window loop."
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true
image.workspace = true
resvg = { version = "0.47", default-features = false }

[target.'cfg(not(target_os = "android"))'.dependencies]
egui-winit = { workspace = true, features = ["wayland", "x11", "links", "clipboard"] }
winit.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
egui-winit.workspace = true
winit = { workspace = true, features = ["android-native-activity"] }
