<!-- @dsCard height=300 -->
<style>
.cv{position:relative;width:960px;height:300px;background:var(--bg);font-family:var(--font-sans);overflow:hidden}
.cv svg{position:absolute;left:480px;top:0}
.a{fill:var(--accent)}.s{fill:var(--accent-soft)}.t{fill:var(--text)}.g{fill:var(--success)}.w{fill:var(--surface)}
.cv h1{position:absolute;left:40px;bottom:64px;margin:0;font:800 64px/.95 var(--font-sans);color:var(--text);max-width:440px}
.cv p{position:absolute;left:40px;bottom:36px;margin:0;font:500 14px/18px var(--font-sans);color:var(--muted)}
</style>
<div class="cv">
<svg width="480" height="300" viewBox="0 0 480 300" aria-hidden="true">
<!-- blocks: accent 200x200 (radius-lg 20), text 130x130, accent-soft 160x90, success 90x90; arrangement: a modular grid of outer surfaces gap 10 apart, bleeding off top and right.
     pattern: geometric, modular UI -> tiles cut by the radius scale, each inner tile set space-3 (12) inside its block with radius-sm (8): the suite's nested corners.
     steps: gap 10, space-3 12; radii: radius-lg 20, radius-sm 8, radius-pill for one pill. -->
<rect class="a" x="40" y="-20" width="200" height="200" rx="20"/>
<rect class="w" x="52" y="-8" width="84" height="84" rx="8" opacity=".9"/>
<rect class="w" x="146" y="-8" width="82" height="84" rx="8" opacity=".35"/>
<rect class="t" x="250" y="-20" width="130" height="130" rx="20"/>
<rect class="s" x="390" y="-20" width="160" height="90" rx="20"/>
<rect class="g" x="390" y="80" width="90" height="90" rx="20"/>
<rect class="s" x="250" y="120" width="130" height="60" rx="30"/>
<rect class="s" x="40" y="190" width="120" height="120" rx="20"/>
<rect class="a" x="170" y="190" width="210" height="120" rx="20"/>
<rect class="w" x="182" y="202" width="186" height="40" rx="8" opacity=".9"/>
<rect class="t" x="390" y="180" width="160" height="130" rx="20"/>
</svg>
<h1>Quezka Suite</h1>
<p>One look for every app: big, clear, calm, with corners that nest.</p>
</div>
